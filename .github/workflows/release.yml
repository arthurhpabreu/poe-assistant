name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package:windows
      - name: Verify clean Windows and native PoB startup
        shell: pwsh
        run: ./scripts/verify-clean-windows.ps1
      - name: Verify explicit constructors with pinned official PoB
        shell: pwsh
        run: ./scripts/verify-clean-windows.ps1 -SourceRevision a69391d6daaaea1aaf8054668a094aad88dd7eaa
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne ('v' + $package.version)) { throw 'Tag and package version differ.' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'A reviewed release already exists; preserving its assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME --verify-tag --title ('PoE Assistant ' + $package.version) --generate-notes --repo $env:GITHUB_REPOSITORY (Get-ChildItem dist -File | ForEach-Object FullName)
